<!doctype html>
<html lang="bn" class="dark">

    <link rel="apple-touch-icon" href="/vite.png" />

      name="keywords"
      content="Royal Academy, দৈনিক পাঠ, সাপ্তাহিক পরীক্ষা, বাংলা স্কুল, নোটিশ"

    <meta name="author" content="Royal Academy" />
    <link rel="canonical" href="https://your-domain.com" />

    <!-- ─── Open Graph ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Royal Academy" />
    <meta
      property="og:title"
      content="Royal Academy — আজকের পড়া ও পরীক্ষার তথ্য"
    />

      property="og:description"
      content="দৈনিক পাঠ, সাপ্তাহিক পরীক্ষা, নোটিশ ও শ্রেণি তথ্য।"

    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:locale" content="bn_BD" />

    <!-- ─── Twitter Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Royal Academy" />

      name="twitter:description"
      content="দৈনিক পাঠ, সাপ্তাহিক পরীক্ষা, নোটিশ।"
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <!-- chrome shortcut app -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="vite-icon" href="/vite.png" />

    <!-- ─── Font ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&display=swap"
